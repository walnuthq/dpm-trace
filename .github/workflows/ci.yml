name: ci

# The gate for every push and pull request. The suites drive the compiled
# binary, which tests/lit.cfg.py locates through DPM_TRACE_BIN.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # gofmt and go vet run in the `go` job; this adds staticcheck, errcheck
      # and ineffassign. Configuration, including why fmt.Fprint* is excluded
      # from errcheck, is in .golangci.yml.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.0

  go:
    name: go build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile the release matrix
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/trace || exit 1
            echo "built $target"
          done

  lit:
    name: lit
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          # The suite drivers are Python programs that drive the binary; the
          # tool itself has no Python in it.
          python-version: '3.11'
      - name: Install lit + FileCheck
        run: |
          # filecheck is a pure-Python FileCheck. The LLVM package pulls ~650MB
          # through apt for one binary, and an apt mirror stall is what hung
          # this job before. It installs lowercase; the suites call FileCheck.
          python3 -m pip install --upgrade pip lit filecheck
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$(command -v filecheck)" "$RUNNER_TEMP/bin/FileCheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the binary
        run: |
          go build -o "$RUNNER_TEMP/dpm-trace" ./cmd/trace
          echo "DPM_TRACE_BIN=$RUNNER_TEMP/dpm-trace" >> "$GITHUB_ENV"
      - name: lit tests
        # golden.test runs tests/check-golden.py, so the byte-exact goldens are
        # covered here rather than in a job of their own.
        run: lit tests -v

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # Fails the job below this. Raise it as coverage improves; never lower it
      # to make a red build green.
      COVERAGE_FLOOR: '60.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lit + FileCheck
        run: |
          # filecheck is a pure-Python FileCheck. The LLVM package pulls ~650MB
          # through apt for one binary, and an apt mirror stall is what hung
          # this job before. It installs lowercase; the suites call FileCheck.
          python3 -m pip install --upgrade pip lit filecheck
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$(command -v filecheck)" "$RUNNER_TEMP/bin/FileCheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Coverage
        # Both layers write covdata, so `covdata merge` deduplicates blocks
        # exactly. Concatenating two textfmt profiles double-counts the blocks
        # they share, which overstates the total and makes the floor
        # mode-dependent.
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/unitcov" "$RUNNER_TEMP/suitecov"

          go test ./... -cover -args -test.gocoverdir="$RUNNER_TEMP/unitcov"

          go build -cover -o "$RUNNER_TEMP/dpm-cov" ./cmd/trace
          export GOCOVERDIR="$RUNNER_TEMP/suitecov"
          export DPM_TRACE_BIN="$RUNNER_TEMP/dpm-cov"
          lit tests -q || echo "::warning::lit reported failures under instrumentation"
          python3 tests/check-golden.py .
          unset GOCOVERDIR DPM_TRACE_BIN

          unit="$(go tool covdata func -i="$RUNNER_TEMP/unitcov" | tail -1 | awk '{print $NF}')"
          total="$(go tool covdata func -i="$RUNNER_TEMP/unitcov,$RUNNER_TEMP/suitecov" | tail -1 | awk '{print $NF}')"
          go tool covdata textfmt -i="$RUNNER_TEMP/unitcov,$RUNNER_TEMP/suitecov" -o=coverage.out

          {
            echo "### Coverage"
            echo
            echo "| scope | statements |"
            echo "| --- | --- |"
            echo "| unit tests only | $unit |"
            echo "| including lit + goldens | **$total** |"
            echo
            echo "Floor: ${COVERAGE_FLOOR}%"
            echo
            echo '<details><summary>Per package</summary>'
            echo
            echo '```'
            go tool covdata percent -i="$RUNNER_TEMP/unitcov,$RUNNER_TEMP/suitecov"
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          value="${total%\%}"
          if awk "BEGIN{exit !($value < $COVERAGE_FLOOR)}"; then
            echo "::error::coverage $total is below the floor of ${COVERAGE_FLOOR}%"
            exit 1
          fi
          echo "coverage $total (floor ${COVERAGE_FLOOR}%)"

      - uses: actions/upload-artifact@v4
        # act has no artifact backend (no ACTIONS_RUNTIME_TOKEN); skip it there
        # so a local run of this job is not reported as failed.
        if: always() && !env.ACT
        with:
          name: coverage
          path: coverage.out
